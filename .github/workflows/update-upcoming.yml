name: Atualizar proximos eventos

# Roda o scraper de proximos cards do ufcstats.com e publica
# backend/ml/artifacts/upcoming.json na release "artifacts-latest"
# (sobrescrita, sem historico no git). O backend pega o card novo no cold
# start, sem precisar de redeploy.
#
# O anti-bot do ufcstats nao passa com Chromium headless, entao o navegador
# roda "visivel" dentro de um display virtual (xvfb). Se o site endurecer o
# anti-bot, o job FALHA (o scraper nunca grava dado parcial) e o site
# continua com o ultimo upcoming.json bom.

on:
  schedule:
    - cron: "0 9 * * 0" # todo domingo, 09:00 UTC (06:00 em Brasilia)
  workflow_dispatch: # botao "Run workflow" para testar/forcar

permissions:
  contents: write

concurrency:
  group: update-upcoming
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Nao gravar .pyc no checkout: o working tree tem que ficar limpo
      # para o `git pull --rebase` no fim do job.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias do scraper
        run: |
          pip install -r scraper/requirements.txt
          playwright install --with-deps chromium

      - name: Testes offline do scraper
        working-directory: scraper
        run: python test_scraper.py

      - name: Coletar proximos eventos
        working-directory: scraper
        run: xvfb-run -a --server-args="-screen 0 1280x900x24" python scrape_upcoming.py

      - name: Publicar proximos eventos na release (sobrescreve, sem historico)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: backend/ml/artifacts
        run: |
          if ! gh release view artifacts-latest >/dev/null 2>&1; then
            gh release create artifacts-latest --latest=false \
              --title "Artefatos do modelo (latest)" \
              --notes "Sobrescrito a cada execucao agendada. Nao versionado no git." \
              || gh release view artifacts-latest >/dev/null
          fi
          gh release upload artifacts-latest upcoming.json --clobber
