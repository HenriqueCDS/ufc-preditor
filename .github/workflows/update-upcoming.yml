name: Atualizar proximos eventos

# Roda o scraper de proximos cards do ufcstats.com e commita
# backend/ml/artifacts/upcoming.json quando algo mudou. O push em main
# dispara o deploy da Vercel, que passa a servir o card novo em /api/events/*.
#
# O anti-bot do ufcstats nao passa com Chromium headless, entao o navegador
# roda "visivel" dentro de um display virtual (xvfb). Se o site endurecer o
# anti-bot, o job FALHA (o scraper nunca grava dado parcial) e o site
# continua com o ultimo upcoming.json bom.

on:
  schedule:
    - cron: "0 9 * * 0" # todo domingo, 09:00 UTC (06:00 em Brasilia)
  workflow_dispatch: # botao "Run workflow" para testar/forcar

permissions:
  contents: write

concurrency:
  group: update-upcoming
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias do scraper
        run: |
          pip install -r scraper/requirements.txt
          playwright install --with-deps chromium

      - name: Testes offline do scraper
        working-directory: scraper
        run: python test_scraper.py

      - name: Coletar proximos eventos
        working-directory: scraper
        run: xvfb-run -a --server-args="-screen 0 1280x900x24" python scrape_upcoming.py

      - name: Commitar se mudou
        run: |
          if git diff --quiet -- backend/ml/artifacts/upcoming.json; then
            echo "upcoming.json sem mudancas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/ml/artifacts/upcoming.json
          git commit -m "chore: atualiza proximos eventos (scraper agendado)"
          git push
